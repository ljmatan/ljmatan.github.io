<!DOCTYPE html>
<html lang="hr">
<head>
  <base href="/apps/dominus_skripta/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dominus Skripta — učenje, testovi i grupni kviz Škole Dominus.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dominus">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FAF7F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161114" media="(prefers-color-scheme: dark)">

  <title>Dominus Skripta</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <style>
    /* Framework-free splash painted from the very first byte until Flutter renders its first
       frame. It matches the in-app splash (docs/design.md §6.1): the paper page colour of the
       OS theme, the brand mark with an ink wordmark and a thin indeterminate bar, nothing for
       the first 300 ms, so the hand-off to Flutter never flashes a different colour. */
    :root {
      --page: #FAF7F5;
      --ink: #1E1A1D;
      --primary: #4D2447;
      --track: #F1E3EE;
      --muted: #6B5F68;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #161114;
        --ink: #F2EAEF;
        --primary: #E3B4D6;
        --track: #5A2A52;
        --muted: #B9ABB5;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--page);
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: var(--page);
      transition: opacity 320ms ease;
      z-index: 2147483647;
    }

    /* Faded out once Flutter is ready, then removed from the DOM. */
    #splash.splash--hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      animation: splash-in 300ms ease 300ms forwards;
    }

    #splash .mark {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #ffffff;
    }

    #splash .name {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #splash .eyebrow {
      color: var(--primary);
      font-family: "Rubik", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
    }

    #splash .wordmark {
      color: var(--ink);
      font-family: "Literata", Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: 600;
      line-height: 1;
    }

    #splash .bar {
      position: relative;
      width: 120px;
      height: 2px;
      overflow: hidden;
      border-radius: 1px;
      background: var(--track);
      opacity: 0;
      animation: splash-in 300ms ease 300ms forwards;
    }

    #splash .bar::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 40%;
      background: var(--primary);
      animation: splash-slide 1.2s ease-in-out infinite;
    }

    @keyframes splash-in {
      to { opacity: 1; }
    }

    @keyframes splash-slide {
      from { transform: translateX(-100%); }
      to   { transform: translateX(250%); }
    }

    #splash .slow {
      max-width: 280px;
      margin: 0;
      font: 400 14px/20px "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--muted);
      text-align: center;
      visibility: hidden;
    }
    #splash.splash--slow .slow { visibility: visible; }
    @media (prefers-reduced-motion: reduce) {
      #splash .brand, #splash .bar { animation: none; opacity: 1; }
      #splash .bar::after { animation: none; width: 100%; opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Učitavanje…">
    <div class="brand">
      <!-- Škola Dominus: the school's round badge and the product name. -->
      <img class="mark" src="icons/dominus-logo.png" alt="Škola Dominus">
      <div class="name">
        <div class="wordmark">Dominus</div>
        <div class="eyebrow">SKRIPTA</div>
      </div>
    </div>
    <div class="bar"></div>
    <p class="slow">Učitavanje traje dulje nego inače — aplikacija se preuzima prvi put. Nakon toga radi i bez interneta.</p>
  </div>

  <script>
    // Remove the splash the moment Flutter paints its first frame, fading it out over the
    // in-app splash (same page colour) for a smooth hand-off. It is never removed before that —
    // a blank page on a slow first download reads as a broken site — but after 8 s it says why
    // the wait is long.
    (function () {
      var splash = document.getElementById('splash');
      var removed = false;
      function hideSplash() {
        if (removed || !splash) return;
        removed = true;
        splash.classList.add('splash--hidden');
        splash.addEventListener('transitionend', function () {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        });
      }
      window.addEventListener('flutter-first-frame', hideSplash);
      window.setTimeout(function () {
        if (!removed && splash) splash.classList.add('splash--slow');
      }, 8000);
    })();

    // Offline use: sw.js (generated after the build by plugins/edu/tool/web_offline.dart) keeps
    // a copy of the app. Once the app has painted, it is told every file this visit loaded —
    // the CanvasKit build this browser picked, the fonts — since the first visit's requests
    // happen before the worker controls the page; then it fetches every lesson picture in the
    // background, unless the browser asks to save data.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.warn('Offline copy unavailable:', e);
      });
      window.addEventListener('flutter-first-frame', function () {
        navigator.serviceWorker.ready.then(function (registration) {
          var urls = performance.getEntriesByType('resource').map(function (entry) { return entry.name; });
          if (!registration.active) return;
          registration.active.postMessage({ type: 'cache-urls', urls: urls });
          var saveData = navigator.connection && navigator.connection.saveData;
          if (!saveData) registration.active.postMessage({ type: 'cache-images' });
        });
      });
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
